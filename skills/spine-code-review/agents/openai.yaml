interface:
  display_name: "Spine Code Review"
  short_description: "Repo-specific Kotlin, Java, and build review"
  default_prompt: >-
    Use $spine-code-review to review Kotlin, Java, and build changes against
    repo-specific Spine rules (AGENTS.md filter, safety rules, testing, version
    gate); it defers general Kotlin language standards to $kotlin-engineer.
