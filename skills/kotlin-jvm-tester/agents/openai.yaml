interface:
  display_name: "Kotlin JVM Tester"
  short_description: "How to write JVM tests in Kotlin for Spine — for both Kotlin and Java code."
  default_prompt: >-
    Use $kotlin-jvm-tester whenever you add or restructure a JVM test in the Spine
    SDK. New tests are Kotlin (even for Java production code): JUnit 5 structure with
    Kotest assertions, stubs not mocks, `internal` `Spec`-suffixed classes, the
    backticked `@Nested` layout, and `testlib` helpers (`UtilityClassTest`,
    `ClassTest`, `SingletonTest`, Guava `EqualsTester`). Naming: default `XSpec`;
    `XKtSpec` only to dodge a class-name clash with an existing Java `XSpec`;
    `XIgTest` for integration tests; and `XJavaSpec` — written in Java with Google
    Truth — to verify a Kotlin class works from Java across the compatibility bridge.
    It owns test-writing conventions for `raise-coverage`; defer to
    `$kotlin-engineer` for the Kotlin inside each test body. See SKILL.md.
