name: Re-request AI review

on:
  pull_request_target:
    types:
      - synchronize

permissions:
  pull-requests: write

jobs:
  re-request-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Ask Copilot and Codex to re-review
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- ai-rereview -->';
            const sha = context.payload.pull_request.head.sha;
            const body = `${marker} ${sha}\n\n@copilot review\n@codex review`;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const alreadyRequested = comments.some((comment) =>
              comment.body?.includes(`${marker} ${sha}`)
            );

            if (!alreadyRequested) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
